<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<h2 id="heading">Student Registration Form</h2>

<form id="regForm">

    Username:
    <input type="text" id="username" class="inputField"><br><br>

    Email:
    <input type="text" id="email" class="inputField"><br><br>

    Phone:
    <input type="text" id="phone" class="inputField"><br><br>

    Password:
    <input type="password" id="password" class="inputField"><br><br>

    Confirm Password:
    <input type="password" id="confirmPassword" class="inputField"><br><br>

    <button type="submit" id="submitBtn">Register</button>
    <button type="button" id="changeImageBtn">Change Image</button>

</form>

<br>

<img id="myImage" src="https://via.placeholder.com/150">

<br><br>

<button id="addTextBtn">Add Text Node</button>
<button id="deleteNodeBtn">Delete Image</button>

<p id="output"></p>

<script src="script.js"></script>

</body>
</html>
